[build-system]
requires = ["setuptools>=69.0,<81.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research-platform"
version = "0.1.0"
description = "A reproducible local quantitative research platform for Phase 1."
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "ruamel.yaml>=0.18,<0.19",
    "yfinance>=0.2.40,<1",
    "exchange-calendars>=4.5,<5",
    "pyarrow>=16,<20",
    "duckdb>=1.0,<2",
    "zipline-reloaded>=3.0,<4",
    "mlflow>=2.16,<2.17",
    "streamlit>=1.35,<2",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.2,<9",
    "hypothesis>=6.100,<7",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
    "coverage>=7.5,<8",
]

[tool.uv]
managed = true
package = true
default-groups = ["dev"]
required-version = ">=0.8,<1"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B009"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
check_untyped_defs = true
warn_unused_ignores = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
markers = [
    "integration: tests crossing an internal infrastructure boundary",
    "external: tests that require an external provider or service",
    "memory: tests that exercise memory/resource bounds",
    "smoke: fast project setup and wiring checks",
]

[tool.coverage.run]
branch = true
source = ["quant_research_platform"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.hypothesis]
profile = "default"

[tool.hypothesis.profiles.default]
max_examples = 100
deadline = 1000

[tool.hypothesis.profiles.ci]
max_examples = 200
deadline = 1000
derandomize = true
