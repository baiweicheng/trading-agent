[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-agent"
version = "0.1.0"
description = "Local-first paper trading agent scaffold."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic",
    "pydantic-settings",
    "pandas",
    "numpy",
    "streamlit",
    "plotly",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
trading-agent = "trading_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["trading_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
